################################################################################
# BASICS
################################################################################

# Truecolor + 256 color
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:RGB'
set -ga terminal-overrides ',alacritty:RGB'

# Prefix: Ctrl-Space (free Cmd-Space → Raycast, Ctrl-Space → tmux)
set -g prefix C-space
unbind C-b
bind C-space send-prefix

# 1-indexed windows/panes, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -s escape-time 0
set -g history-limit 100000
set-option -g mouse on
set -g focus-events on

# Don't drop you out of tmux when killing the last session.
set -g detach-on-destroy off
# OSC 52 system clipboard — works in SSH/remote contexts where pbcopy isn't reachable.
set -g set-clipboard on

################################################################################
# COPY MODE (vi)
################################################################################

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

unbind -n MouseDrag1Pane
bind -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= "#{pane_in_mode}" "copy-mode -eM" "send-keys -M"' 'copy-mode -eM'
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

################################################################################
# PANE / WINDOW
################################################################################

# vim-style pane focus
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Clear pane scrollback + visible screen (prefix Ctrl-l, Ctrl-L mnemonic).
bind C-l send-keys C-l \; clear-history \; display-message "Scrollback cleared"

# Aggressive kill: SIGKILL the pane's process group before tmux closes it.
# Catches dev servers (npm/vite/etc.) that ignore the default SIGHUP.
bind x confirm-before -p "kill-pane #P? (y/n)" "run-shell '~/.config/tmux/scripts/kill-pane-aggressive.sh \"#{pane_id}\"'"
bind X confirm-before -p "kill-window #W? (y/n)" "run-shell '~/.config/tmux/scripts/kill-window-aggressive.sh \"#{window_id}\"'"
bind Q confirm-before -p "kill-session #S? (y/n)" "run-shell '~/.config/tmux/scripts/kill-session-aggressive.sh \"#{session_id}\"'"
unbind &

# resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap panes
bind -r C-j swap-pane -D
bind -r C-k swap-pane -U

# swap windows: shift current window left/right (keeps focus on it).
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1
# Shift-arrow fallbacks (work even when Shift+, / Shift+. is intercepted on JIS).
bind -r S-Left  swap-window -d -t -1
bind -r S-Right swap-window -d -t +1

# splits inherit cwd
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Alt-arrow pane focus, no prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded.'

# rename current window/session with current name pre-filled (-I)
bind R command-prompt -I "#W" "rename-window '%%'"
bind S command-prompt -I "#S" "rename-session '%%'"

################################################################################
# STATUS BAR
################################################################################

set-option -g status-position top
set -g status-interval 5

################################################################################
# PLUGINS
################################################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Theme: catppuccin (mocha)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
# Focused window shows the repo/cwd basename (from automatic-rename-format
# below). Unfocused windows just show the current process — at a glance you
# see "what's running where" without scanning a longer label.
# Note: in catppuccin/tmux v2 the unfocused text key is @catppuccin_window_text
# (the v1 @catppuccin_window_default_text is silently ignored).
set -g @catppuccin_window_text ' #{pane_current_command} | #W'
set -g @catppuccin_window_current_text ' #W'
# Override catppuccin's application module icon (default U+F1AE wrench) -> rubber duck.
set -g @catppuccin_application_icon '󰇥 '
# Main accent: blue (matches catppuccin/nix accent + duck bg).
set -g @catppuccin_window_current_color "#{E:@thm_blue}"
set -g @catppuccin_window_current_number_color "#{E:@thm_blue}"
set -g @catppuccin_application_color "#{E:@thm_blue}"
set -g @catppuccin_status_application_icon_fg "#{E:@thm_yellow}"
set -g pane-active-border-style "fg=#{E:@thm_blue}"
set -g @catppuccin_status_left_separator '█'
set -g @catppuccin_status_right_separator '█'
# Catppuccin v2 doesn't auto-set status-left/right — compose explicitly.
set -g status-left-length 100
set -g status-right-length 100
# Center the window list between status-left and status-right.
set -g status-justify centre
# Session on left, application on right — balances width around the
# centered window list so it actually lands in the middle.
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#{?window_zoomed_flag,#[fg=#ed8796#,bold] ZOOM ,}"
set -g status-right "#{E:@catppuccin_status_application}"

# Window auto-rename: just the git-repo basename (or cwd basename if not in
# a repo). Process name is already shown by the status-right application
# segment; no need to duplicate it here.
# `air-closet` is a frequent repo and gets shortened to `ac`.
set -g automatic-rename on
set -g automatic-rename-format '#(basename $(git -C #{pane_current_path} rev-parse --show-toplevel 2>/dev/null || echo #{pane_current_path}) | sed "s/air-closet/ac/g")'

# Session picker: tmux-sessionx (prefix + o → fzf popup)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '70%'
set -g @sessionx-filter-current 'false'

# tmux-thumbs: prefix + F → highlight URLs/paths/hashes, jump-pick
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy && tmux send-keys {}'

# extrakto: prefix + Tab → fzf any string from screen, insert/copy
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'Tab'
set -g @extrakto_clip_tool 'pbcopy'
set -g @extrakto_split_direction 'p'   # popup
set -g @extrakto_popup_size '80%,80%'

# Floating scratch pane (prefix + g toggles) — ephemeral popup that survives toggles.
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'g'
# Make sure prefix-p stays as previous-window (was clobbered when floax-bind was 'p').
bind p previous-window
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# which-key style popup menu after prefix
set -g @plugin 'alexwforsythe/tmux-which-key'

# Resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

################################################################################
# TPM INIT (must stay at bottom)
################################################################################
run '~/.config/tmux/plugins/tpm/tpm'
