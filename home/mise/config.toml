[tools]
# claude moved to nix (modules/home/packages.nix) — version pinned via flake.lock.
node = "20"
ruby = "3.2"
xcodes = "latest"

[settings]
# Read idiomatic per-language version files in addition to mise.toml /
# .tool-versions. `["all"]` is documented but not honored by mise 2026.5.3,
# so the full list from
# https://mise.jdx.dev/configuration.html#idiomatic-version-files
# is enumerated explicitly.
idiomatic_version_file_enable_tools = [
  "atmos",
  "bun",
  "crystal",
  "deno",
  "dotnet",
  "elixir",
  "go",
  "java",
  "node",
  "npm",
  "opentofu",
  "packer",
  "perl",
  "pnpm",
  "python",
  "ruby",
  "rust",
  "terraform",
  "terragrunt",
  "terramate",
  "yarn",
]
